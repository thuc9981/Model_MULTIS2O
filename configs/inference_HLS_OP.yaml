# Configuration for Multi-SAR to Optical translation using Temporal Transformer
# This config uses multiple SAR images from different acquisition dates
# to generate a single optical (HLS RGB) image.

trainer:
  target: trainer.TrainerDifIRLPIPSMultiSAR

autoencoder:
  target: ldm.models.autoencoder.VQModelTorch
  ckpt_path: weights/autoencoder_vq_f4.pth
  use_fp16: false
  tune_decoder: false
  tune_encoder: false
  params:
    lora_tune_decoder: false
    embed_dim: 3
    n_embed: 8192
    ddconfig:
      double_z: false
      z_channels: 3
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult:
      - 1
      - 2
      - 4
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.1
      padding_mode: zeros

model:
  target: models.unet_multisar.UNetModelSwinMultiSAR
  ckpt_path: ""  # Start from scratch or specify pretrained checkpoint
  params:
    image_size: 64
    in_channels: 3
    model_channels: 160
    out_channels: ${autoencoder.params.embed_dim}
    attention_resolutions: [64, 32, 16, 8]
    dropout: 0.1
    channel_mult: [1, 2, 2, 4]
    num_res_blocks: [2, 2, 2, 2]
    conv_resample: true
    dims: 2
    use_fp16: false
    num_head_channels: 32
    use_scale_shift_norm: true
    resblock_updown: false
    swin_depth: 4
    swin_embed_dim: 192
    window_size: 8
    mlp_ratio: 4
    cond_lq: true
    lq_size: 256
    lq_channels: 3     # 3 channels per SAR image: VV, VH, VV/VH (stored as RGB)
    use_confidence: true  # C-DiffSET: enable confidence map prediction
    # Multi-SAR specific parameters
    max_sar_frames: 10          # Maximum number of SAR images to use
    temporal_embed_dim: 384    # Embedding dimension for temporal transformer (reduced for memory)
    temporal_num_heads: 8      # Attention heads in temporal transformer
    temporal_num_layers: 3     # Number of transformer layers for temporal fusion (reduced)
    temporal_fusion_type: attention   # 'attention', 'weighted', or 'mean'
    use_light_temporal: true   # Use lightweight temporal transformer for faster training
    

diffusion:
  target: models.script_util.create_gaussian_diffusion
  params:
    sf: 1
    schedule_name: exponential
    schedule_kwargs:
      power: 0.3
    etas_end: 0.99
    steps: 25
    min_noise_level: 0.2
    kappa: 2.0
    weighted_mse: false
    predict_type: xstart
    timestep_respacing: null
    scale_factor: 1.0
    normalize_input: true
    latent_flag: true

degradation:
  sf: 1
  resize_prob: [0.2, 0.7, 0.1]
  resize_range: [0.15, 1.5]
  gaussian_noise_prob: 0.5
  noise_range: [1, 30]
  poisson_scale_range: [0.05, 3.0]
  gray_noise_prob: 0.4
  jpeg_range: [30, 95]

  second_order_prob: 0.5
  second_blur_prob: 0.8
  resize_prob2: [0.3, 0.4, 0.3]
  resize_range2: [0.3, 1.2]
  gaussian_noise_prob2: 0.5
  noise_range2: [1, 25]
  poisson_scale_range2: [0.05, 2.5]
  gray_noise_prob2: 0.4
  jpeg_range2: [30, 95]

  gt_size: 256
  resize_back: false
  use_sharp: false

data:
  train:
    name: MultiSAR_Opera_HLS_Train_L2
    type: MultiSARDataset
    phase: train
    dataroot_gt: /mnt/hdd12tb/code/thucnd/Data_HLS_opera_4/Dataset_256x256_test_NP_2/test/HLS
    dataroot_lq: /mnt/hdd12tb/code/thucnd/Data_HLS_opera_4/Dataset_256x256_test_NP_2/test/OPERA
    scale: 1
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true
    max_sar_images: 10            # Must match model.params.max_sar_frames
    min_sar_images: 2            # Need at least 2 for multi-temporal fusion

  val:
    name: MultiSAR_Opera_HLS_Val_L2
    type: MultiSARDataset
    phase: val
    dataroot_gt: /mnt/hdd12tb/code/thucnd/Data_HLS_opera_4/Dataset_256x256_test_NP_2/test/HLS
    dataroot_lq: /mnt/hdd12tb/code/thucnd/Data_HLS_opera_4/Dataset_256x256_test_NP_2/test/OPERA
    io_backend:
      type: disk
    scale: 1
    val_freq: 1000
    save_img: true
    max_sar_images: 10            # Must match model.params.max_sar_frames
    min_sar_images: 2            # Need at least 2 for multi-temporal fusion

train:
  lr: 5e-5
  lr_min: 2e-5
  lr_schedule: cosin
  warmup_iterations: 1000
  batch: [8, 8]              # Reduced for 1 GPU (was [4, 4] for 2 GPUs)
  microbatch: 8             # Process one at a time to minimize memory
  num_workers: 8
  prefetch_factor: 2
  weight_decay: 0
  ema_rate: 0.999
  iterations: 4000000
  save_freq: 5000
  log_freq: [200, 5000, 1]
  loss_coef: [1, 0.2,0.2]     # mse + lpips
  cdiff_beta: 1            # C-Diff loss beta (0 = standard MSE, 1 = confidence-weighted)
  local_logging: true
  tf_logging: True
  use_ema_val: true
  grad_clip_norm: 1.0
  val_freq: ${train.save_freq}
  val_y_channel: false       # RGB output, not grayscale
  val_resolution: ${model.params.lq_size}
  val_padding_mode: reflect
  val_max_images: 50
  disable_degradation: true
  use_amp: false
  resume_load_amp_scaler: false
  nonfinite_recompute_fp32: true
  nonfinite_reset_scaler_after: 50
  nonfinite_log_every: 20
  # fixed_timestep: 15       
  seed: 1255
  global_seeding: false
  compile:
    flag: false
    mode: reduce-overhead

wandb:
  project: "Multi-SAR-to-Optical-ResShift"
  entity: null
  name: "MultiSAR_TemporalTransformer_Opera_HLS"
  mode: "online"
