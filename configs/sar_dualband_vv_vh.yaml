trainer:
  target: trainer.TrainerDifIRLPIPS

autoencoder:
  target: ldm.models.autoencoder.VQModelTorch
  ckpt_path: weights/autoencoder_vq_f4.pth
  use_fp16: true
  tune_decoder: false
  params:
    lora_tune_decoder: false        
    embed_dim: 3
    n_embed: 8192
    ddconfig:
      double_z: false
      z_channels: 3
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult:
      - 1
      - 2
      - 4
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0
      padding_mode: zeros

model:
  target: models.unet.UNetModelSwin
  ckpt_path: weights/resshift_realsrx4_s15_v2.pth
  params:
    image_size: 64
    in_channels: 3
    model_channels: 160
    out_channels: ${autoencoder.params.embed_dim}
    attention_resolutions: [64, 32, 16, 8]
    dropout: 0
    channel_mult: [1, 2, 2, 4]
    num_res_blocks: [2, 2, 2, 2]
    conv_resample: true
    dims: 2
    use_fp16: True
    num_head_channels: 32
    use_scale_shift_norm: true
    resblock_updown: false
    swin_depth: 2
    swin_embed_dim: 192
    window_size: 8
    mlp_ratio: 4
    cond_lq: true
    lq_size: 256
    lq_channels: 2     # ← 2 channels: VV (primary) + VH (auxiliary)
    use_confidence: true  # C-DiffSET: enable confidence map prediction

diffusion:
  target: models.script_util.create_gaussian_diffusion
  params:
    sf: 1
    schedule_name: exponential
    schedule_kwargs:
      power: 0.3
    etas_end: 0.99
    steps: 4
    min_noise_level: 0.2
    kappa: 2.0
    weighted_mse: false
    predict_type: xstart
    timestep_respacing: null
    scale_factor: 1.0
    normalize_input: true
    latent_flag: true

degradation:
  sf: 1
  resize_prob: [0.2, 0.7, 0.1]
  resize_range: [0.15, 1.5]
  gaussian_noise_prob: 0.5
  noise_range: [1, 30]
  poisson_scale_range: [0.05, 3.0]
  gray_noise_prob: 0.4
  jpeg_range: [30, 95]

  second_order_prob: 0.5
  second_blur_prob: 0.8
  resize_prob2: [0.3, 0.4, 0.3]
  resize_range2: [0.3, 1.2]
  gaussian_noise_prob2: 0.5
  noise_range2: [1, 25]
  poisson_scale_range2: [0.05, 2.5]
  gray_noise_prob2: 0.4
  jpeg_range2: [30, 95]

  gt_size: 256
  resize_back: false
  use_sharp: false

data:
  train:
    name: SAR_DualBand_Train
    type: DualBandSARDataset
    phase: train
    dataroot_gt: /mnt/fwgpu/hdd12tb/code/thucnd/Data_Despeckling/train/s2
    dataroot_lq: /mnt/fwgpu/hdd12tb/code/thucnd/Data_Despeckling/train/s1
    scale: 1
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true
    vv_channel_bgr: 2
    vh_channel_bgr: 1
    lq_suffix_remove: "_S1"

  val:
    name: SAR_DualBand_Val
    type: DualBandSARDataset
    phase: val
    dataroot_gt: /mnt/fwgpu/hdd12tb/code/thucnd/Data_Despeckling/val/s2
    dataroot_lq: /mnt/fwgpu/hdd12tb/code/thucnd/Data_Despeckling/val/s1
    io_backend:
      type: disk
    scale: 1
    val_freq: 1000
    save_img: true
    vv_channel_bgr: 2
    vh_channel_bgr: 1
    lq_suffix_remove: "_S1"

train:
  lr: 5e-5
  lr_min: 2e-5
  lr_schedule: cosin
  warmup_iterations: 1000
  batch: [16, 4]
  microbatch: 6
  num_workers: 8
  prefetch_factor: 2
  weight_decay: 0
  ema_rate: 0.999
  iterations: 400000
  save_freq: 5000
  log_freq: [100, 1000, 1]
  loss_coef: [0.5, 1.0]     # mse + lpips
  cdiff_beta: 1              # C-Diff loss beta (0 = standard MSE, 1 = confidence-weighted)
  local_logging: true
  tf_logging: True
  use_ema_val: true
  val_freq: ${train.save_freq}
  val_y_channel: true
  val_resolution: ${model.params.lq_size}
  val_padding_mode: reflect
  val_max_images: 100
  disable_degradation: true
  use_amp: true
  seed: 123456
  global_seeding: false
  compile:
    flag: false
    mode: reduce-overhead

wandb:
  project: "SAR-DualBand-VV-VH-ResShift"
  entity: null
  name: "DualBand_VV_primary_VH_aux"
  mode: "online"
